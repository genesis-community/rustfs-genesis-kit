---
name:    rustfs
version: 0.1.0

author:
  - Wayne Seguin <weseguin@fivetwenty.io>
code:    https://github.com/genesis-community/rustfs-genesis-kit
docs:    https://genesisproject.io/docs/

genesis_version_min: 3.1.0

services:
- s3

supports:
- aws
- azure
- gcp
- openstack
- pve
- vsphere
- stackit

required_configs:
  # The manifest takes static IPs from the cloud config network, and the
  # check hook confirms the vm type, network, and disk type it names.
  cloud: [ blueprint, manifest, check ]

credentials:
  base:
    # S3 access/secret keys. Alphanumeric only to stay safe in URLs, headers,
    # and shell. Generated on `genesis add-secrets`.  They are fixed, so that
    # `genesis rotate-secrets` leaves them alone; every client holds them.
    # Rotate them on purpose with the reset-credentials (r) addon.
    credentials:
      access_key: random 20 allowed-chars a-zA-Z0-9 fixed
      secret_key: random 40 allowed-chars a-zA-Z0-9 fixed

certificates:
  base:
    certs:
      ca: { valid_for: 10y }
      peer:
        valid_for: 10y
        names:
          - rustfs_cluster_peer
          - 127.0.0.1
      # S3 API certificate, which also carries internode RPC.  Peers dial each
      # other at their static IPs over https and verify this certificate, so
      # it names every node's address.  The blueprint writes those addresses
      # to meta.api_cert_ips whenever params.ips or the ocfp subnets supply
      # them.  Genesis dereferences scalars only, so each list slot is its own
      # maybe: entry, and the slots past the end of the list drop out.  The
      # blueprint refuses more addresses than there are slots.
      api:
        valid_for: 2y
        names:
          - "${meta.domain}"
          - 127.0.0.1
          - "${maybe:meta.api_cert_ips.0}"
          - "${maybe:meta.api_cert_ips.1}"
          - "${maybe:meta.api_cert_ips.2}"
          - "${maybe:meta.api_cert_ips.3}"
          - "${maybe:meta.api_cert_ips.4}"
          - "${maybe:meta.api_cert_ips.5}"
          - "${maybe:meta.api_cert_ips.6}"
          - "${maybe:meta.api_cert_ips.7}"
          - "${maybe:meta.api_cert_ips.8}"
          - "${maybe:meta.api_cert_ips.9}"
          - "${maybe:meta.api_cert_ips.10}"
          - "${maybe:meta.api_cert_ips.11}"
          - "${maybe:meta.api_cert_ips.12}"
          - "${maybe:meta.api_cert_ips.13}"
          - "${maybe:meta.api_cert_ips.14}"
          - "${maybe:meta.api_cert_ips.15}"
