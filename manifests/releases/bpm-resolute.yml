---
# bpm for ubuntu-resolute.  Loaded by the resolute feature, because bpm
# releases older than 1.4.41 do not compile on resolute (their tini package
# needs an older CMake than resolute ships).  It merges over
# manifests/releases/bpm.yml by release name.  Bump it together with that
# file so the two pins do not drift apart.
releases:
- name:    bpm
  version: 1.4.41
  url:     https://bosh.io/d/github.com/cloudfoundry/bpm-release?v=1.4.41
  sha1:    sha256:7b445508d63d2171d892ba33f836087e1e519b9782f44c5fa5290323616ca8e6
